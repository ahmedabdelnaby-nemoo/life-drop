<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5;url=/donors?from=splash">
    <title>Life Drop - تبرع بالدم، أنقذ حياة</title>
    <link rel="preload" as="image" href="{{ url_for('static', filename='life-drop.png') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
        }

        .splash-container {
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        .logo-wrapper {
            margin-bottom: 40px;
            animation: slideUp 1.5s ease-out 0.3s both;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-wrapper img {
            max-width: 300px;
            height: auto;
            filter: drop-shadow(0 10px 30px rgba(255, 0, 0, 0.3));
        }

        .logo-fallback {
            display: none;
            font-size: 120px;
            line-height: 1;
            filter: drop-shadow(0 10px 30px rgba(255, 0, 0, 0.3));
        }

        .logo-wrapper.fallback-active img {
            display: none;
        }

        .logo-wrapper.fallback-active .logo-fallback {
            display: block;
        }

        .brand-title {
            font-size: 48px;
            color: #fff;
            margin: 30px 0 15px;
            animation: slideUp 1.5s ease-out 0.6s both;
            letter-spacing: 2px;
        }

        .brand-subtitle {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 40px;
            animation: slideUp 1.5s ease-out 0.9s both;
        }

        .loading-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 50px;
            animation: slideUp 1.5s ease-out 1.2s both;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e74c3c;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.6;
            }
        }

        @media (max-width: 600px) {
            .brand-title { font-size: 36px; }
            .logo-wrapper img { max-width: 200px; }
            .logo-fallback { font-size: 80px; }
            .brand-subtitle { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo-wrapper" id="logoWrapper">
            <img
                id="splashLogo"
                src="{{ url_for('static', filename='life-drop.png') }}"
                alt="Life Drop Logo"
                onerror="document.getElementById('logoWrapper').classList.add('fallback-active')"
            >
            <div class="logo-fallback" aria-hidden="true">🩸</div>
        </div>
        <h1 class="brand-title">Life Drop</h1>
        <p class="brand-subtitle">تبرع بالدم، أنقذ حياة</p>
        <div class="loading-indicator">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        (function () {
            var DONORS_URL = '/donors?from=splash';
            var MIN_DISPLAY_MS = 3500;
            var MAX_WAIT_MS = 6000;
            var redirected = false;

            function goToDonors() {
                if (redirected) return;
                redirected = true;
                window.location.replace(DONORS_URL);
            }

            var logo = document.getElementById('splashLogo');
            var started = Date.now();

            function scheduleRedirect() {
                var elapsed = Date.now() - started;
                var delay = Math.max(0, MIN_DISPLAY_MS - elapsed);
                setTimeout(goToDonors, delay);
            }

            if (logo.complete) {
                scheduleRedirect();
            } else {
                logo.addEventListener('load', scheduleRedirect);
                logo.addEventListener('error', scheduleRedirect);
            }

            setTimeout(goToDonors, MAX_WAIT_MS);
        })();
    </script>
</body>
</html>
